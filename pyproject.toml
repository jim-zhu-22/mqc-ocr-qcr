[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mqc-ocr-qcr"
version = "0.0.0.dev0"
description = "Reviewable MQC OCR to quality scoring research demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymupdf>=1.24,<2", "pillow>=10,<13", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mqc-qcr = "mqc_qcr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mqc_qcr = ["static/*", "prompts/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
